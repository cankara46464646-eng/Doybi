  <link rel="preload" as="image" href="assets/assets/brand/letter-o.png">
  <link rel="preload" as="image" href="assets/assets/brand/letter-y.png">
  <link rel="preload" as="image" href="assets/assets/brand/letter-b.png">
  <link rel="preload" as="image" href="assets/assets/brand/letter-i.png">

  <link rel="preload" as="font" type="font/ttf" href="assets/assets/fonts/Figtree-Bold.ttf" crossorigin>
  <title>Doybi İşletme</title>
  <script>
    // Yüksek çözünürlüklü telefonlarda (3x) çizim yükünü azalt: 2x yeterince keskin, çok daha akıcı.
    (function () {
      var d = window.devicePixelRatio || 1;
      if (d > 2) {
        try { Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true }); } catch (e) {}
      }
    })();
    window.__doybiStart = Date.now();
  </script>
  <style>
    /* Açılış: zemin, iOS ana ekran açılış görseliyle (icons/startup-*.png) birebir aynı; geçişte beyaz parlama olmaz. */
    @font-face { font-family: 'Figtree'; font-weight: 700; font-display: swap; src: url('assets/assets/fonts/Figtree-Bold.ttf') format('truetype'); }
    html, body { margin: 0; height: 100%; background: #FC361B; overflow: hidden; }
    #splash {
      position: fixed; inset: 0; z-index: 10; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(60% 42% at 50% 44%, rgba(255, 140, 60, .55) 0%, rgba(255, 140, 60, 0) 100%),
        linear-gradient(180deg, #FC361B 0%, #FD5C0F 100%);
      transition: opacity .38s ease;
    }
    #splash.out { opacity: 0; }
    #stage { display: flex; flex-direction: column; align-items: center; transform: translateY(-2vh); transition: transform .38s cubic-bezier(.2, .7, .2, 1); }
    #splash.out #stage { transform: translateY(-2vh) scale(1.08); }

    /* arkadaki halkalar (giriş ekranındakiyle aynı) */
    .ring { position: absolute; border-radius: 50%; border: 20px solid rgba(255, 255, 255, .12); opacity: 0;
      animation: ring 1.4s cubic-bezier(.2, .8, .2, 1) both, float 7s ease-in-out infinite alternate; }
    .r1 { width: 280px; height: 280px; right: -110px; top: -70px; animation-delay: .05s, 1.45s; }
    .r2 { width: 170px; height: 170px; left: -70px; bottom: 70px; animation-delay: .25s, 1.65s; }
    .r3 { width: 64px; height: 64px; right: 36px; bottom: 150px; border-width: 10px; animation-delay: .45s, 1.85s; }
    @keyframes ring { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: scale(1); } }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-14px); } }

    /* harfler: yukarıdan düşer, yere değince ezilip zıplar */
    #logo { position: relative; width: 240px; height: 93.6px; }
    #logo .l { position: absolute; opacity: 0; animation: drop .82s var(--d) both; }
    #logo .l img { display: block; width: 100%; height: 100%; transform-origin: 50% var(--o, 100%); animation: squash .82s var(--d) both; }
    #logo .l::after {
      content: ''; position: absolute; left: 5%; width: 90%; bottom: calc(var(--pb, 0px) - 7px); height: 12px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0));
      opacity: 0; animation: puff .55s calc(var(--d) + .36s) ease-out both;
    }
    @keyframes drop {
      0%   { opacity: 0; transform: translateY(-190px); animation-timing-function: cubic-bezier(.5, 0, 1, .6); }
      8%   { opacity: 1; }
      44%  { transform: translateY(0); animation-timing-function: cubic-bezier(0, .4, .5, 1); }
      62%  { transform: translateY(-24px); animation-timing-function: cubic-bezier(.5, 0, 1, .6); }
      78%  { transform: translateY(0); animation-timing-function: cubic-bezier(0, .4, .5, 1); }
      89%  { transform: translateY(-6px); animation-timing-function: cubic-bezier(.5, 0, 1, .6); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes squash {
      0%   { transform: scale(.88, 1.16); }
      42%  { transform: scale(.9, 1.14); }
      48%  { transform: scale(1.22, .76); }
      58%  { transform: scale(.94, 1.07); }
      76%  { transform: scale(1, 1); }
      80%  { transform: scale(1.09, .9); }
      88%  { transform: scale(.98, 1.02); }
      100% { transform: scale(1, 1); }
    }
    @keyframes puff { 0% { opacity: 0; transform: scale(.3); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.5); } }

    /* harfler oturunca üstlerinden altın rengi bir parıltı geçer */
    #shine {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      -webkit-mask: url('assets/assets/brand/logo-white.png') 0 0 / 100% 100% no-repeat;
      mask: url('assets/assets/brand/logo-white.png') 0 0 / 100% 100% no-repeat;
      background: linear-gradient(100deg, rgba(255, 197, 61, 0) 38%, rgba(255, 214, 110, .95) 50%, rgba(255, 197, 61, 0) 62%) no-repeat;
      background-size: 220% 100%; background-position: 135% 0;
      animation: shine .9s 1s cubic-bezier(.45, .05, .55, .95) both;
    }
    @keyframes shine { 0% { opacity: 1; background-position: 135% 0; } 100% { opacity: 1; background-position: -35% 0; } }

    #tag {
      margin-top: 20px; color: #fff; opacity: 0; transform: translateY(8px);
      font: 700 17px/1.2 Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      animation: rise .5s .98s cubic-bezier(.2, .7, .2, 1) both;
    }
    @keyframes rise { to { opacity: .95; transform: translateY(0); } }

    /* uygulama geç açılırsa altta küçük noktalar zıplar */
    #dots { position: absolute; left: 0; right: 0; bottom: calc(48px + env(safe-area-inset-bottom)); text-align: center; opacity: 0; animation: fade .4s 2.6s both; }
    #dots i { display: inline-block; width: 7px; height: 7px; margin: 0 4px; border-radius: 50%; background: rgba(255, 255, 255, .85); animation: hop 1s ease-in-out infinite; }
    #dots i:nth-child(2) { animation-delay: .15s; }
    #dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes hop { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-6px); opacity: 1; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .ring, #logo .l, #logo .l img, #tag { animation: none !important; opacity: 1; transform: none; }
      #logo .l::after, #shine { display: none; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Doybi açılıyor">
    <i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i>
    <div id="stage">
      <div id="logo">
        <span class="l" style="--d:0s;left:0.73px;top:1.22px;width:58.36px;height:73.92px"><img alt="" src="assets/assets/brand/letter-d.png"></span>
        <span class="l" style="--d:.09s;left:57.87px;top:18.97px;width:56.41px;height:56.41px"><img alt="" src="assets/assets/brand/letter-o.png"></span>
        <span class="l" style="--d:.18s;--o:76%;--pb:17.5px;left:109.67px;top:18.97px;width:53.74px;height:73.92px"><img alt="" src="assets/assets/brand/letter-y.png"></span>
        <span class="l" style="--d:.27s;left:164.13px;top:0.97px;width:55.68px;height:74.16px"><img alt="" src="assets/assets/brand/letter-b.png"></span>
        <span class="l" style="--d:.36s;left:219.33px;top:1.22px;width:19.94px;height:72.95px"><img alt="" src="assets/assets/brand/letter-i.png"></span>
        <div id="shine"></div>
      </div>
      <div id="tag">Mahallenin lezzeti, dükkân fiyatına.</div>
    </div>
    <div id="dots"><i></i><i></i><i></i></div>
  </div>
  <script>
    // Uygulama hazır olunca (animasyon en az bir kez bitmiş olarak) açılış ekranını kaldır.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var wait = Math.max(0, (calm ? 600 : 1900) - (Date.now() - window.__doybiStart));
      setTimeout(function () {
        s.classList.add('out');
        setTimeout(function () { s.remove(); }, 420);
      }, wait);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
